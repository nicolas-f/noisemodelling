<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>WPS Server Front</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        select, input, button { margin: 5px 0; display: block; }
        label { font-weight: bold; }
        #inputs-container { margin-top: 10px; }
        #result { margin-top: 20px; white-space: pre-wrap; background: #f0f0f0; padding: 10px; }
    </style>
</head>
<body>

<h2>WPS Server Front-End</h2>

<label for="packageSelect">Choisir un package :</label>
<select id="packageSelect">
    <option value="">-- Sélectionner un package --</option>
</select>

<label for="scriptSelect">Choisir un script :</label>
<select id="scriptSelect" disabled>
    <option value="">-- Sélectionner un script --</option>
</select>

<div id="inputs-container"></div>

<button id="executeBtn" disabled>Exécuter</button>

<h3>Résultat :</h3>
<pre id="result"></pre>

<script>
    const packageSelect = document.getElementById('packageSelect');
    const scriptSelect = document.getElementById('scriptSelect');
    const inputsContainer = document.getElementById('inputs-container');
    const executeBtn = document.getElementById('executeBtn');
    const resultEl = document.getElementById('result');

    // Charger les packages
    fetch('/packages')
        .then(res => res.json())
        .then(data => {
            data.forEach(pkg => {
                const option = document.createElement('option');
                option.value = pkg;
                option.textContent = pkg;
                packageSelect.appendChild(option);
            });
        });

    // Quand un package est sélectionné, charger les scripts
    packageSelect.addEventListener('change', () => {
        scriptSelect.innerHTML = '<option value="">-- Sélectionner un script --</option>';
        inputsContainer.innerHTML = '';
        executeBtn.disabled = true;
        const pkg = packageSelect.value;
        if (!pkg) return;

        fetch(`/packages/${encodeURIComponent(pkg)}/files`)
            .then(res => res.json())
            .then(scripts => {
                scripts.forEach(script => {
                    const option = document.createElement('option');
                    option.value = script;
                    option.textContent = script;
                    scriptSelect.appendChild(option);
                });
                scriptSelect.disabled = false;
            });
    });

    // Quand un script est sélectionné, charger les inputs
    scriptSelect.addEventListener('change', () => {
        inputsContainer.innerHTML = '';
        resultEl.textContent = '';
        const pkg = packageSelect.value;
        const script = scriptSelect.value;
        if (!pkg || !script) {
            executeBtn.disabled = true;
            return;
        }

        fetch(`/script/${encodeURIComponent(pkg)}/${encodeURIComponent(script)}/inputs`)
            .then(res => res.json())
            .then(inputs => {
                inputsContainer.innerHTML = '';
                if (inputs) {
                    for (let key in inputs) {
                        const inputDef = inputs[key];
                        const label = document.createElement('label');
                        label.textContent = inputDef.title || key;
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.name = key;
                        input.value = inputDef.default || '';
                        inputsContainer.appendChild(label);
                        inputsContainer.appendChild(input);
                    }
                    executeBtn.disabled = false;
                }
            })
            .catch(err => {
                inputsContainer.innerHTML = 'Impossible de récupérer les inputs';
                executeBtn.disabled = true;
            });
    });

    // Exécuter le script
    executeBtn.addEventListener('click', () => {
        const pkg = packageSelect.value;
        const script = scriptSelect.value;
        const inputsElems = inputsContainer.querySelectorAll('input');
        const inputs = {};
        inputsElems.forEach(input => {
            inputs[input.name] = input.value;
        });

        // Construire un XML minimal de type WPS Execute
        let xml = `<wps:Execute xmlns:wps="http://www.opengis.net/wps/1.0.0"
                               xmlns:ows="http://www.opengis.net/ows/1.1"
                               service="WPS" version="1.0.0">
                        <ows:Identifier>${script.replace('.groovy','')}</ows:Identifier>
                        <wps:DataInputs>`;
        for (let key in inputs) {
            xml += `<wps:Input>
                        <ows:Identifier>${key}</ows:Identifier>
                        <wps:Data>
                            <wps:LiteralData>${inputs[key]}</wps:LiteralData>
                        </wps:Data>
                    </wps:Input>`;
        }
        xml += `</wps:DataInputs>
                <wps:ResponseForm>
                    <wps:RawDataOutput>
                        <ows:Identifier>result</ows:Identifier>
                    </wps:RawDataOutput>
                </wps:ResponseForm>
                </wps:Execute>`;

        fetch('/wps', {
            method: 'POST',
            headers: {'Content-Type': 'application/xml'},
            body: xml
        })
        .then(res => res.json())
        .then(data => {
            resultEl.textContent = JSON.stringify(data, null, 2);
        })
        .catch(err => {
            resultEl.textContent = 'Erreur : ' + err;
        });
    });
</script>
</body>
</html>
